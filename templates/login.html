{% extends "auth_base.html" %}
{% from "_macros.html" import csrf with context %}
{% block title %}Sign in{% endblock %}
{% block auth_form %}
<h1>Sign in</h1>
<p class="muted">Welcome back. Enter your details to continue.</p>
<form method="post" novalidate>
  {{ csrf() }}
  <label class="field"><span>Username or email</span><input name="identity" value="{{ form.get('identity','') }}" autocomplete="username" required autofocus></label>
  <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
  <button class="btn btn-primary btn-block" type="submit">Sign in</button>
</form>
<p class="muted small center">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
{% endblock %}
